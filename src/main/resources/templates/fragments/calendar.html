<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
  <div th:fragment="calendar" class="calendar">
    <div th:each="day : ${weekDays}">
      <div class="item">
        <div class="date">
          <span th:text="${day.month + '/' + day.date + ' ' + day.weekday}"></span>
        </div>
        <ul class="content">
          <li th:each="plan : ${day.plans}" class="plan-list">・<span th:text="${plan}"></span></li>
        </ul>
      </div>
    </div>
  </div>
</body>
</html>
